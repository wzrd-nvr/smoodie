[project]
name = "smoodie-api"
version = "0.1.0"
description = "smoodie backend API (FastAPI)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic-settings>=2.7",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "greenlet>=3.1",
    "firebase-admin>=7.5.0",
    "google-cloud-storage>=3.13.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6.0",
    "httpx>=0.28",
    "ruff>=0.9",
    "mypy>=1.14",
    "aiosqlite>=0.20",
]

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]

[tool.mypy]
strict = true
packages = ["smoodie_api"]
mypy_path = "src"

# firebase-admin ships no type information. Scoped to that one import rather
# than relaxing strictness anywhere else.
[[tool.mypy.overrides]]
module = ["firebase_admin.*", "google.cloud.*", "google.auth.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# "." makes tests/ importable as a package (shared fakes); "src" means the
# suite does not depend on the editable install resolving, which has broken
# once already.
pythonpath = [".", "src"]

[tool.coverage.run]
source = ["smoodie_api"]

[tool.coverage.report]
# The GCS and Firebase adapters are excluded via "pragma: no cover". Both must
# stay pure translation layers with no branching of their own — the moment one
# grows a decision, it needs a test and the pragma has to come off.
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]
