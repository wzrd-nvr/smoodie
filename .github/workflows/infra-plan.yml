name: infra-plan

on:
  pull_request:
    paths: ["infra/**", "Makefile", ".github/workflows/infra-plan.yml"]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - run: make verify-infra
    # A real plan against GCP (via WIF) is enabled once the projects
    # and state buckets exist - see infra/terraform/README.md.
