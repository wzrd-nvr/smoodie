name: ci-api

on:
  pull_request:
    paths: ["apps/api/**", "Makefile", ".github/workflows/ci-api.yml"]
  push:
    branches: [main]
    paths: ["apps/api/**", "Makefile", ".github/workflows/ci-api.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: smoodie
          POSTGRES_PASSWORD: smoodie
          POSTGRES_DB: smoodie
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U smoodie"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      SMOODIE_ENV: ci
      SMOODIE_DATABASE_URL: postgresql+asyncpg://smoodie:smoodie@localhost:5432/smoodie
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock
      - run: uv sync --frozen
        working-directory: apps/api
      # The same target an agent runs before proposing a change. There is no
      # weaker path for agent-authored pull requests and no bypass label.
      - run: make verify-api
