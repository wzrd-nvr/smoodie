services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: smoodie
      POSTGRES_PASSWORD: smoodie
      POSTGRES_DB: smoodie
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smoodie"]
      interval: 5s
      timeout: 3s
      retries: 10

  firebase:
    image: node:24-slim
    working_dir: /srv
    command: >
      sh -c "npx -y firebase-tools emulators:start
      --only auth --project smoodie-local
      --config /srv/firebase.json"
    volumes:
      - ./scripts/firebase.json:/srv/firebase.json:ro
    ports:
      - "9099:9099" # Auth emulator
      - "4000:4000" # Emulator UI

  pubsub:
    image: gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators
    command: gcloud beta emulators pubsub start --host-port=0.0.0.0:8085 --project=smoodie-local
    ports:
      - "8085:8085"

volumes:
  pgdata:
