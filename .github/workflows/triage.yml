name: issue-triage
# Read-only except for adding one label. It never comments, never closes, and
# never touches code. Pattern: anthropics/claude-code oncall-triage.yml.
#
# Manual-only for now. The schedule is commented out rather than deleted
# because it is the intended end state: with no credential configured the
# action fails on every run, and four failures a day is noise that trains you
# to ignore the workflow. Restore the cron once a credential exists and there
# are enough bug reports for triage to have something to do.
#
# Credential: either an ANTHROPIC_API_KEY secret (per-token Console billing) or
# a CLAUDE_CODE_OAUTH_TOKEN secret from `claude setup-token`, which draws on a
# Pro/Max subscription instead. Swap the `with:` key below to match.
on:
  # schedule:
  #   - cron: "0 */6 * * *"
  workflow_dispatch:
permissions:
  issues: write
  contents: read
jobs:
  triage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Read skills/triage/SKILL.md and ONCALL.md.

            List open issues labelled `type:bug` updated in the last 3 days. For
            each, decide whether it blocks a user from a core smoodie flow:
            signing in, publishing a recipe, or loading a recipe page. The
            severity norms in ONCALL.md define this; apply them literally.

            Be conservative. An issue you are unsure about is not labelled.

            Your ONLY action is `gh issue edit <n> --add-label oncall` on
            qualifying issues. Do not comment. Do not close. Do not edit code.
            Do not add any other label.
          claude_args: "--allowedTools Bash(gh issue list*),Bash(gh issue view*),Bash(gh issue edit*)"
