name: ci-web

on:
  pull_request:
    paths: ["apps/web/**", "packages/**", "pnpm-workspace.yaml", "Makefile", ".github/workflows/ci-web.yml"]
  push:
    branches: [main]
    paths: ["apps/web/**", "packages/**", "pnpm-workspace.yaml", "Makefile", ".github/workflows/ci-web.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The same target an agent runs before proposing a change. There is no
      # weaker path for agent-authored pull requests and no bypass label.
      - run: make verify-web
